<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password reset — {{ PRODUCT_NAME }}</title><link rel="stylesheet" href="/static/public/styles.css"></head><body><main class="shell"><h1>Reset password</h1>{% if message %}<p>{{ message }}</p>{% endif %}{% if show_form %}<form method="post">{% csrf_token %}<label for="password">New password</label><input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"><label for="password_confirm">Confirm new password</label><input id="password_confirm" name="password_confirm" type="password" minlength="10" required autocomplete="new-password"><button class="primary" type="submit">Update password</button></form>{% endif %}</main></body></html>
