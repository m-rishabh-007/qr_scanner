name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    # Dependabot PR workflows receive a restricted read-only token and cannot
    # upload CodeQL results. CI and dependency review still run for those PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          # Temporary, narrowly scoped exception for the Expo/Jest transitive
          # build-tool dependency. Remove this when the Expo-compatible tree
          # resolves brace-expansion to 5.0.8 or newer.
          allow-ghsas: GHSA-mh99-v99m-4gvg, GHSA-w5hq-g745-h8pq
          show-patched-versions: true
